name: Cazar ofertas

# Monitoreo continuo: cada ejecución vigila las tiendas sin parar durante ~5,5 horas
# (un ciclo cada ~3 minutos). El cron solo sirve para encadenar la siguiente:
# si ya hay una corriendo, la nueva queda en espera y parte apenas termina la anterior.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de monitoreo"
        default: "335"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: cazar
  cancel-in-progress: false

jobs:
  cazar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar datos anteriores (rama "datos")
        run: |
          mkdir -p data site/data
          if git ls-remote --exit-code --heads origin datos >/dev/null; then
            git fetch --depth 1 origin datos
            git --work-tree=data checkout origin/datos -- .
            git reset -q
          fi
          cp data/sitio-ofertas.json site/data/ofertas.json 2>/dev/null || echo '{"generado":0,"ofertas":[]}' > site/data/ofertas.json
          cp data/sitio-estado.json site/data/estado.json 2>/dev/null || echo '{"generado":0,"catalogo":0,"tiendas":{}}' > site/data/estado.json
          ls -la data

      - name: Publicar la página
        run: cp -r web/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Monitorear (bucle continuo)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -u run.py --minutos "${{ inputs.minutos || '335' }}"

      - name: Mantener activa la programación
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cazar.yml/enable" || true
